name: Refresh LoL Esports Data

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update-esports-data.mjs"
      - "scripts/update-player-stats.mjs"
      - ".github/workflows/update-esports-data.yml"

permissions:
  contents: write

concurrency:
  group: refresh-lol-esports-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Fetch current LoL Esports schedule and rosters
        run: node scripts/update-esports-data.mjs
        env:
          LOL_ESPORTS_API_KEY: ${{ secrets.LOL_ESPORTS_API_KEY }}

      - name: Fetch ChainCC player statistics
        run: node scripts/update-player-stats.mjs

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- esports-data.js player-stats.js; then
            echo "No esports data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add esports-data.js player-stats.js
          git commit -m "Auto-refresh LoL esports and player stats"
          git push
