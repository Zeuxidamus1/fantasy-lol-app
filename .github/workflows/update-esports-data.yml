name: Refresh LoL Esports Data

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-lol-esports-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Check API credential
        id: api
        env:
          LOL_ESPORTS_API_KEY: ${{ secrets.LOL_ESPORTS_API_KEY }}
        run: |
          if [ -n "$LOL_ESPORTS_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::LOL_ESPORTS_API_KEY is not configured. Keeping the last known-good data snapshot."
          fi

      - name: Fetch current LoL Esports schedule and rosters
        if: steps.api.outputs.available == 'true'
        run: node scripts/update-esports-data.mjs
        env:
          LOL_ESPORTS_API_KEY: ${{ secrets.LOL_ESPORTS_API_KEY }}

      - name: Commit refreshed data
        if: steps.api.outputs.available == 'true'
        run: |
          if git diff --quiet -- esports-data.js; then
            echo "No esports data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add esports-data.js
          git commit -m "Auto-refresh LoL Esports data"
          git push
