name: Validate App

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Run syntax and repository checks
        run: npm run check
      - name: Run browser route smoke tests
        run: bash scripts/browser-smoke.sh
