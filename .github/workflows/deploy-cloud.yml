name: Release Supabase Backend

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply pending database migrations after the dry run"
        required: true
        type: boolean
        default: false
      deploy_functions:
        description: "Deploy tracked Edge Functions after validation"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-backend-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Run complete release gate
        run: npm run release:check

      - name: Validate database release configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::Missing secret SUPABASE_DB_URL"
            exit 1
          fi

      - name: Preview pending database migrations
        run: npx --yes supabase@2.119.0 db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: Apply pending database migrations
        if: ${{ inputs.apply_migrations }}
        run: npx --yes supabase@2.119.0 db push --db-url "$SUPABASE_DB_URL"

      - name: Validate Edge Function release configuration
        if: ${{ inputs.deploy_functions }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Missing secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::Missing variable SUPABASE_PROJECT_REF"
            exit 1
          fi

      - name: Deploy sync-match-stats
        if: ${{ inputs.deploy_functions }}
        run: npx --yes supabase@2.119.0 functions deploy sync-match-stats --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy sync-pandascore-validator
        if: ${{ inputs.deploy_functions }}
        run: npx --yes supabase@2.119.0 functions deploy sync-pandascore-validator --project-ref "$SUPABASE_PROJECT_REF"

      - name: Release summary
        run: |
          echo "### Backend release gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validation: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Migration dry run: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Migrations applied: ${{ inputs.apply_migrations }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Edge Functions deployed: ${{ inputs.deploy_functions }}" >> "$GITHUB_STEP_SUMMARY"
