name: Deploy Cloud Backend

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate required cloud configuration
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Missing repository secret SUPABASE_DB_URL"
            exit 1
          fi
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Missing repository variable SUPABASE_URL"
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing repository variable SUPABASE_ANON_KEY"
            exit 1
          fi
          case "$SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "::error::SUPABASE_URL must be an https://*.supabase.co URL"; exit 1 ;;
          esac

      - name: Apply database schema
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/schema.sql

      - name: Generate browser-safe backend configuration
        run: |
          node <<'NODE'
          const fs=require("fs");
          const url=process.env.SUPABASE_URL||"";
          const key=process.env.SUPABASE_ANON_KEY||"";
          if (/service[_-]?role/i.test(key)) {
            throw new Error("Refusing to write a service-role credential to frontend configuration.");
          }
          const body=`window.RIFT_CONFIG = Object.freeze({
            supabaseUrl: ${JSON.stringify(url)},
            supabaseAnonKey: ${JSON.stringify(key)}
          });\n`;
          fs.writeFileSync("backend-config.js",body);
          NODE

      - name: Commit public frontend configuration
        run: |
          if git diff --quiet -- backend-config.js; then
            echo "Frontend configuration already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-config.js
          git commit -m "Configure production cloud backend"
          git push
