<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="Rift Fantasy is a mobile-first fantasy League of Legends esports app with shared leagues, drafts, rosters, schedules, waivers, and trades." />
  <meta name="color-scheme" content="dark" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>" />
  <title>Rift Fantasy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261005-4" />
</head>
<body>
  <noscript><div class="no-js-message">Rift Fantasy requires JavaScript to run. Enable JavaScript and reload the page.</div></noscript>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">FANTASY LEAGUE OF LEGENDS</div>
        <h1>Rift Fantasy</h1>
      </div>
      <div class="topbar-actions"><button class="icon-btn" id="accountBtn" aria-label="Account">👤</button><button class="icon-btn notification-btn" id="notificationBtn" aria-label="Notifications">🔔<span class="notification-badge" id="notificationBadge" hidden>0</span></button></div>
    </header>

    <main id="app"></main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button class="nav-item active" data-view="home"><span aria-hidden="true">⌂</span><small>Home</small></button>
      <button class="nav-item" data-view="team"><span aria-hidden="true">♟</span><small>My Team</small></button>
      <button class="nav-item" data-view="schedule"><span aria-hidden="true">▣</span><small>Schedule</small></button>
      <button class="nav-item" data-view="players"><span aria-hidden="true">⌕</span><small>Players</small></button>
      <button class="nav-item" data-view="league"><span aria-hidden="true">🏆</span><small>League</small></button>
    </nav>
  </div>


  <template id="login-template">
    <section class="login-screen">
      <div class="login-brand" aria-label="Rift Fantasy">
        <div class="login-mark" aria-hidden="true">RF</div>
        <div class="login-kicker">FANTASY LEAGUE OF LEGENDS</div>
        <h1>Rift Fantasy</h1>
        <p>Draft pros. Build your roster. Compete with friends.</p>
      </div>

      <section class="login-card" aria-labelledby="loginTitle">
        <div class="login-card-head">
          <h2 id="loginTitle">Welcome back</h2>
          <p>Sign in to continue to your leagues.</p>
        </div>

        <div class="form-group">
          <label for="landingEmail">Email</label>
          <input id="landingEmail" class="form-control login-control" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" />
        </div>

        <div class="form-group">
          <div class="field-label-row">
            <label for="landingPassword">Password</label>
          </div>
          <div class="password-field">
            <input id="landingPassword" class="form-control login-control" type="password" autocomplete="current-password" minlength="8" placeholder="Password" />
            <button class="password-toggle" id="landingPasswordToggle" type="button" aria-label="Show password">Show</button>
          </div>
        </div>

        <button class="primary-btn login-primary" id="landingSignIn">Sign In</button>

        <div class="login-help-row">
          <button class="inline-help-btn" id="landingForgotUsername" type="button">Forgot username?</button>
          <button class="inline-help-btn" id="landingForgotPassword" type="button">Forgot password?</button>
        </div>
        <div class="login-resend-row">
          <button class="inline-help-btn" id="landingResendVerification" type="button" hidden>Resend verification</button>
        </div>

        <div class="login-divider"><span>New to Rift Fantasy?</span></div>
        <button class="secondary-btn login-secondary" id="landingCreateAccount" type="button">Create Account</button>
      </section>

      <p class="login-legal">By continuing, you agree to use Rift Fantasy responsibly. Riot Games is not affiliated with this project.</p>
    </section>
  </template>


  <template id="signup-template">
    <section class="login-screen signup-screen">
      <div class="login-brand compact-brand" aria-label="Rift Fantasy">
        <div class="login-mark" aria-hidden="true">RF</div>
        <div class="login-kicker">RIFT FANTASY</div>
        <h1>Create your account</h1>
        <p>Start building your fantasy League of Legends leagues.</p>
      </div>

      <section class="login-card" aria-labelledby="signupTitle">
        <div class="login-card-head">
          <h2 id="signupTitle">Join Rift Fantasy</h2>
          <p>Create one account for your leagues, rosters, and drafts.</p>
        </div>

        <div class="form-group">
          <label for="signupEmail">Email</label>
          <input id="signupEmail" class="form-control login-control" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" />
        </div>

        <div class="form-group">
          <label for="signupPassword">Password</label>
          <div class="password-field">
            <input id="signupPassword" class="form-control login-control" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" />
            <button class="password-toggle" id="signupPasswordToggle" type="button" aria-label="Show password">Show</button>
          </div>
        </div>

        <div class="form-group">
          <label for="signupPasswordConfirm">Confirm password</label>
          <input id="signupPasswordConfirm" class="form-control login-control" type="password" autocomplete="new-password" minlength="8" placeholder="Re-enter your password" />
        </div>

        <button class="primary-btn login-primary" id="signupSubmit">Create Account</button>
        <button class="text-btn auth-back-btn" id="signupBack" type="button">Already have an account? Sign in</button>
      </section>

      <p class="login-legal">By creating an account, you agree to use Rift Fantasy responsibly. Riot Games is not affiliated with this project.</p>
    </section>
  </template>

  <template id="verify-template">
    <section class="login-screen verify-screen">
      <div class="login-brand compact-brand">
        <div class="login-mark verify-mark" aria-hidden="true">✓</div>
        <div class="login-kicker">ONE MORE STEP</div>
        <h1>Check your email</h1>
        <p>We sent a verification link to <strong id="verifyEmailText">your email</strong>.</p>
      </div>

      <section class="login-card verify-card">
        <div class="verify-copy">
          <h2>Verify your account</h2>
          <p>Open the email from Rift Fantasy and tap the verification link. Once verified, you’ll return to the app and be signed in.</p>
        </div>
        <button class="secondary-btn login-secondary" id="verifyBackToLogin" type="button">Back to Sign In</button>
        <button class="inline-help-btn verify-resend-btn" id="verifyResendBtn" type="button" hidden>Resend verification email</button>
        <p class="verify-wait" id="verifyWaitText">You can request another email in about 1 minute.</p>
      </section>
    </section>
  </template>

  <template id="account-template">
    <section class="stack">
      <div class="section-title">
        <div><div class="eyebrow">RIFT ACCOUNT</div><h2>Account</h2></div>
        <button class="secondary-btn" data-jump="home">Back</button>
      </div>
      <section class="card setup-card" id="authCard">
        <div class="section-head"><div><div class="eyebrow">ACCOUNT</div><h3>Sign in to Rift Fantasy</h3></div></div>
        <div class="form-group"><label for="authEmail">Email</label><input id="authEmail" class="form-control" type="email" autocomplete="email" placeholder="you@example.com" /></div>
        <div class="form-group"><label for="authPassword">Password</label><input id="authPassword" class="form-control" type="password" autocomplete="current-password" minlength="8" placeholder="At least 8 characters" /></div>
        <div class="grid-two"><button class="primary-btn" id="signInBtn">Sign In</button><button class="secondary-btn" id="signUpBtn">Create Account</button></div>
        <div class="auth-help-actions">
          <button class="text-btn" id="resendVerifyBtn" hidden>Resend verification email</button>
          <button class="text-btn" id="forgotPasswordBtn">Forgot password?</button>
        </div>
        <p class="setup-footnote" id="authHelp">Use one account to keep your leagues and rosters available across devices.</p>
      </section>
      <section class="card setup-card recovery-card" id="recoveryCard" hidden>
        <div class="section-head"><div><div class="eyebrow">RESET PASSWORD</div><h3>Choose a new password</h3></div><span class="verified-badge">SECURE</span></div>
        <div class="form-group">
          <label for="newPassword">New password</label>
          <input id="newPassword" class="form-control" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" />
        </div>
        <button class="primary-btn" id="saveNewPasswordBtn">Save New Password</button>
        <p class="setup-footnote">This screen only appears after opening a valid password-reset email link.</p>
      </section>

      <section class="card setup-card" id="signedInCard" hidden>
        <div class="section-head"><div><div class="eyebrow">SIGNED IN</div><h3 id="signedInEmail">Manager</h3></div><span class="verified-badge">CLOUD</span></div>
        <button class="secondary-btn" id="signOutBtn">Sign Out</button>
      </section>
    </section>
  </template>

  <template id="home-template">
    <section class="stack home-dashboard">
      <div class="section-title">
        <div><div class="eyebrow" id="homeLeagueEyebrow">RIFT FANTASY</div><h2 id="homeTitle">Home</h2></div>
        <span class="league-phase-pill" id="homeLeaguePhase" hidden>PRE-DRAFT</span>
      </div>

      <section class="card home-league-card" id="homeLeagueCard" hidden>
        <div class="section-head">
          <div><div class="eyebrow">ACTIVE LEAGUE</div><h3 id="homeLeagueName">League</h3></div>
          <button class="text-btn" data-jump="league">League</button>
        </div>
        <div class="home-league-grid">
          <div><small>Your team</small><strong id="homeTeamName">My Team</strong></div>
          <div><small>Managers</small><strong id="homeManagerCount">0/0</strong></div>
          <div><small>Roster</small><strong id="homeRosterCount">0/0</strong></div>
        </div>
      </section>

      <section class="card" id="homeNextCard" hidden>
        <div class="section-head">
          <div><div class="eyebrow">NEXT STEP</div><h3 id="homeNextTitle">Get started</h3></div>
        </div>
        <p class="profile-copy" id="homeNextCopy"></p>
        <button class="primary-btn" id="homeNextAction">Continue</button>
      </section>

      <section class="card" id="homeRosterCard" hidden>
        <div class="section-head"><div><div class="eyebrow">YOUR TEAM</div><h3>Roster</h3></div><button class="text-btn" data-jump="team">Manage</button></div>
        <div id="starterPreview" class="player-list"></div>
      </section>


      <section class="card home-empty-card" id="homeNoLeague">
        <div class="empty-state">
          <strong>Start your first league</strong>
          <small>Create a league or join one with an invite code to begin.</small>
          <button class="primary-btn" data-jump="league">Go to League</button>
        </div>
      </section>
    </section>
  </template>

  <template id="team-template">
    <section class="stack team-screen">
      <div class="section-title">
        <div>
          <div class="eyebrow" id="teamLeagueName">ACTIVE LEAGUE</div>
          <h2 id="myTeamName">My Team</h2>
        </div>
        <div class="team-title-actions">
          <button class="text-btn" id="renameTeamBtn">Edit Name</button>
          <span class="verified-badge" id="teamSyncBadge">SYNCED</span>
        </div>
      </div>

      <section class="card team-name-editor" id="teamNameEditor" hidden>
        <div class="form-group">
          <label for="teamNameInput">Team name</label>
          <input id="teamNameInput" class="form-control" maxlength="40" placeholder="Your team name" />
        </div>
        <div class="grid-two">
          <button class="primary-btn" id="saveTeamNameBtn">Save</button>
          <button class="secondary-btn" id="cancelTeamNameBtn">Cancel</button>
        </div>
      </section>

      <section class="card compact team-summary-card">
        <div class="stat-row"><span>Roster</span><strong id="teamRosterCount">0/0</strong></div>
        <div class="stat-row"><span>Starting lineup</span><strong id="teamStarterCount">0/6</strong></div>
      </section>

      <section class="roster-status-banner" id="rosterStatusBanner" aria-live="polite">
        <strong id="rosterStatusTitle">⚠ Roster Incomplete</strong>
        <small id="rosterStatusCopy">Checking your roster…</small>
      </section>

      <section class="card team-roster-card">
        <div class="section-head">
          <div><h3>Starting Players</h3></div>
          <button class="text-btn" data-jump="players">Add Players</button>
        </div>
        <div id="starterRosterList" class="roster"></div>
      </section>

      <section class="card team-roster-card">
        <div class="section-head">
          <div><h3>FLEX</h3></div>
        </div>
        <div id="flexRosterList" class="roster"></div>
      </section>

      <section class="card team-roster-card">
        <div class="section-head">
          <div><h3>Bench</h3></div>
        </div>
        <div id="benchRosterList" class="roster"></div>
      </section>

      <div class="grid-two">
        <button class="action-card" data-jump="players"><span class="action-icon">＋</span><strong>Players</strong><small>Add or review players</small></button>
        <button class="action-card" data-jump="transactions"><span class="action-icon">↕</span><strong>Transactions</strong><small>Waivers, adds & drops</small></button>
      </div>

      <section class="card team-no-league" id="teamNoLeague" hidden>
        <div class="empty-state">
          <strong>No active league</strong>
          <small>Join or create a league before building your team.</small>
          <button class="primary-btn" data-jump="league">Go to League</button>
        </div>
      </section>
    </section>
  </template>

  <template id="matchup-template">
    <section class="stack">
      <div class="section-title"><div><div class="eyebrow">HEAD TO HEAD</div><h2>Matchup</h2></div></div>
      <section class="card">
        <div class="empty-state">
          <strong>Fantasy scoring is not live yet</strong>
          <small>Your real head-to-head matchup will appear here once the game-stat scoring feed is connected. No demo scores are shown.</small>
          <button class="secondary-btn" data-jump="schedule">View Pro Schedule</button>
        </div>
      </section>
    </section>
  </template>

  <template id="schedule-template">
    <section class="stack">
      <div class="section-title">
        <div><div class="eyebrow">PRO MATCHES</div><h2>Schedule</h2></div>
      </div>

      <div class="filter-row schedule-filters">
        <button class="chip active" data-day="all">All</button>
        <button class="chip" data-day="today">Today</button>
        <button class="chip" data-day="tomorrow">Tomorrow</button>
        <button class="chip" data-day="upcoming">Upcoming</button>
      </div>

      <details class="tournament-guide-details">
        <summary class="wide-link-btn tournament-guide-summary">Tournament Guide &amp; Format Help <span aria-hidden="true">⌄</span></summary>
        <section class="card tournament-guide-inline">
          <div class="section-head">
            <div><div class="eyebrow">HOW PRO LOL WORKS</div><h3>Tournament Guide</h3></div>
          </div>
          <p class="tournament-guide-intro">Follow the general path from regional competition to the Worlds Final. Exact formats can vary by event and season.</p>

          <div class="tournament-flow" aria-label="League of Legends tournament path">
            <div class="flow-node"><small>START</small><strong>Regional Leagues</strong><span>LCK · LPL · LEC · Americas &amp; more</span></div>
            <div class="flow-arrow">↓</div>
            <div class="flow-node"><small>QUALIFY</small><strong>Regional Playoffs</strong><span>Top teams compete for seeds and international qualification</span></div>
            <div class="flow-branch">
              <div class="flow-branch-card"><small>MID-SEASON EVENT</small><strong>MSI</strong><span>A separate international tournament held before Worlds</span></div>
              <div class="flow-arrow horizontal">→</div>
              <div class="flow-branch-card worlds-path"><small>SEASON CHAMPIONSHIP PATH</small><strong>Worlds Qualification</strong><span>Teams earn or secure a spot at Worlds</span></div>
            </div>
            <div class="flow-arrow">↓</div>
            <div class="flow-node worlds-node"><small>WORLD CHAMPIONSHIP</small><strong>Worlds</strong><span>Qualified teams enter the season-ending championship tournament</span></div>
            <div class="flow-arrow">↓</div>
            <div class="flow-node"><small>ADVANCEMENT</small><strong>Swiss / Group-style Stage</strong><span>Teams play for enough wins to advance and avoid elimination</span></div>
            <div class="flow-arrow">↓</div>
            <div class="flow-node"><small>ELIMINATION</small><strong>Knockout Stage</strong><span>Lose the series and your Worlds run ends</span></div>
            <div class="flow-arrow">↓</div>
            <div class="flow-node final-node"><small>FINAL STEP</small><strong>Worlds Final</strong><span>The championship series that decides the world champion</span></div>
          </div>

          <div class="section-head tournament-terms-head"><div><div class="eyebrow">FORMAT TERMS</div><h3>What does that mean?</h3></div></div>
          <div class="tournament-term-list">
            <details class="tournament-term-detail-card"><summary><strong>BO1</strong><small>Best of 1</small></summary><p>One game decides the winner. There is no second or third game to recover from a loss.</p></details>
            <details class="tournament-term-detail-card"><summary><strong>BO3</strong><small>Best of 3</small></summary><p>The first team to win 2 games wins the series. A series can end 2–0 or 2–1.</p></details>
            <details class="tournament-term-detail-card"><summary><strong>BO5</strong><small>Best of 5</small></summary><p>The first team to win 3 games wins the series. A series can last anywhere from 3 to 5 games.</p></details>
            <details class="tournament-term-detail-card"><summary><strong>Playoffs</strong><small>Higher-stakes stage</small></summary><p>The stage after regular competition where teams play to advance, qualify, or win the regional title.</p></details>
            <details class="tournament-term-detail-card"><summary><strong>Swiss</strong><small>Record-based pairings</small></summary><p>Teams are paired mainly against teams with similar records until they reach the advancement or elimination threshold.</p></details>
            <details class="tournament-term-detail-card"><summary><strong>Knockout</strong><small>Lose and you're out</small></summary><p>An elimination bracket. Lose the series and you are out; win and you advance.</p></details>
            <details class="tournament-term-detail-card"><summary><strong>Seed</strong><small>Tournament placement</small></summary><p>A team's placement going into an event or bracket, usually based on earlier results or qualification position.</p></details>
            <details class="tournament-term-detail-card"><summary><strong>Qualifier</strong><small>Earn a tournament spot</small></summary><p>A match, series, or mini-tournament used to earn a place in a larger event such as Worlds.</p></details>
          </div>
        </section>
      </details>

      <div id="scheduleList" class="stack tight"></div>
    </section>
  </template>

  <template id="player-template">
    <section class="stack player-profile">
      <div class="section-title">
        <button class="secondary-btn" id="playerBackBtn">← Players</button>
        <button class="secondary-btn" id="watchPlayerBtn">☆ Watchlist</button>
      </div>

      <section class="card player-hero">
        <div class="profile-badge" id="profileRole">MID</div>
        <div class="profile-main">
          <div class="eyebrow" id="profileTeam">TEAM</div>
          <h2 id="profileName">Player</h2>
          <div class="profile-meta">
            <span id="profileRank">Fantasy rank #—</span>
            <span id="profileStatus">Available</span>
          </div>
        </div>
        <div class="profile-projection"><small>Season KDA</small><strong id="profileProjection">—</strong></div>
      </section>

      <div class="profile-actions three-actions">
        <button class="primary-btn" id="profileAddBtn">Add Player</button>
        <button class="secondary-btn" id="profileWaiverBtn">Waiver Claim</button>
        <button class="secondary-btn" id="profileTradeBtn">Trade</button>
      </div>

      <section class="card">
        <div class="section-head"><div><div class="eyebrow">FANTASY OUTLOOK</div><h3>Why this player is valuable</h3></div></div>
        <p class="profile-copy" id="profileOutlook"></p>
      </section>

      <section class="card">
        <div class="section-head"><div><div class="eyebrow">PLAYER DETAILS</div><h3>Recent performance</h3></div></div>
        <div class="profile-stats" id="profileStats"></div>
        <p class="profile-disclaimer" id="profileDataNote">Historical professional match statistics powered by ChainCC.</p>
      </section>

      <section class="card">
        <div class="section-head"><div><div class="eyebrow">UPCOMING</div><h3>Next matches</h3></div></div>
        <div id="profileMatches" class="stack tight"></div>
      </section>

      <section class="card">
        <div class="section-head"><div><div class="eyebrow">RECENT FORM</div><h3>Last matches</h3></div></div>
        <div id="profileTrend" class="stack tight"></div>
      </section>
      <p class="profile-source" id="profileSource">Stats source: ChainCC · CC BY 4.0</p>
    </section>
  </template>

  <template id="players-template">
    <section class="stack">
      <div class="section-title"><div><div class="eyebrow">FREE AGENTS</div><h2>Players</h2></div></div>
      <label class="search"><span>⌕</span><input id="playerSearch" aria-label="Search players, teams or roles" placeholder="Search players, teams or roles" /></label>
      <div class="filter-row">
        <button class="chip active" data-role="ALL">All</button>
        <button class="chip" data-role="TOP">Top</button>
        <button class="chip" data-role="JNG">Jungle</button>
        <button class="chip" data-role="MID">Mid</button>
        <button class="chip" data-role="ADC">ADC</button>
        <button class="chip" data-role="SUP">Support</button>
      </div>
      <div class="card schedule-note" id="playerDataNotice" hidden>
        <strong>Player data unavailable</strong>
        <small>The current esports roster feed is unavailable. Check back after the next data refresh.</small>
      </div>
      <div id="freeAgentList" class="player-list"></div>
    </section>
  </template>

  <template id="league-template">
    <section class="stack league-page">
      <div class="section-title league-page-title">
        <div>
          <div class="eyebrow" id="leagueNameLabel">SUMMONER'S CUP</div>
          <h2>League</h2>
        </div>
        <button class="secondary-btn commissioner-only" id="leagueSetupBtn" data-jump="setup" hidden>Commissioner Tools</button>
      </div>

      <section class="card league-overview-card" id="leagueOverviewCard">
        <div class="league-overview-head">
          <div>
            <div class="eyebrow">ACTIVE LEAGUE</div>
            <h3 id="leagueOverviewName">No league selected</h3>
          </div>
          <span class="status-pill league-overview-status" id="leagueOverviewStatus">—</span>
        </div>
        <div class="league-overview-grid">
          <div>
            <small>Your Team</small>
            <strong id="leagueOverviewTeam">—</strong>
          </div>
          <div>
            <small>Role</small>
            <strong id="leagueOverviewRole">—</strong>
          </div>
          <div>
            <small>Invite Code</small>
            <strong id="leagueOverviewInvite">—</strong>
          </div>
        </div>
        <p class="profile-copy league-overview-copy" id="leagueOverviewCopy">Select or create a league below to get started.</p>
      </section>

      <div class="card league-state-card" id="leagueStateCard" hidden>
        <div class="section-head">
          <div><div class="eyebrow">LEAGUE STATUS</div><h3 id="leagueStateTitle">League archived</h3></div>
          <span class="status-pill" id="leagueStatePill">ARCHIVED</span>
        </div>
        <p class="profile-copy" id="leagueStateCopy">This league is read-only. History, standings, rosters, draft results, and transactions remain available.</p>
      </div>

      <section class="league-section">
        <div class="league-section-heading">
          <div>
            <div class="eyebrow">QUICK ACCESS</div>
            <h3>League tools</h3>
          </div>
        </div>
        <div class="league-quick-grid">
          <button class="action-card" data-jump="team"><span class="action-icon">◈</span><strong>My Team</strong><small>Roster & lineup</small></button>
          <button class="action-card" data-jump="draft"><span class="action-icon">◎</span><strong>Draft Room</strong><small>Draft board & picks</small></button>
          <button class="action-card" data-jump="transactions"><span class="action-icon">↕</span><strong>Transactions</strong><small>Waivers, adds & drops</small></button>
        </div>
      </section>

      <section class="card cloud-league-card" id="cloudLeagueCard">
        <div class="section-head">
          <div>
            <div class="eyebrow">MY LEAGUES</div>
            <h3 id="cloudLeagueTitle">Your leagues</h3>
          </div>
        </div>
        <p class="profile-copy" id="cloudLeagueCopy">Choose which league you want to manage.</p>
        <div id="cloudLeagueList" class="stack tight league-list"></div>

        <details class="league-add-panel" id="leagueAddPanel">
          <summary>Add a league</summary>
          <div class="cloud-league-actions" id="cloudLeagueActions" hidden>
            <div class="league-create-block">
              <div class="league-subhead">
                <strong>Create a League</strong>
                <small>Start a new fantasy league and become commissioner.</small>
              </div>
              <div class="create-league-fields">
                <input class="form-control" id="newLeagueName" maxlength="40" placeholder="League name" aria-label="New league name" />
                <input class="form-control" id="newLeagueTeamName" maxlength="40" placeholder="Your team name" aria-label="Your team name" />
              </div>
              <button class="primary-btn" id="createCloudLeagueBtn" disabled>Create League</button>
            </div>

            <div class="league-divider"><span>OR</span></div>

            <div class="league-join-block">
              <div class="league-subhead">
                <strong>Join a League</strong>
                <small>Enter a commissioner-provided invite code.</small>
              </div>
              <div class="join-league-row">
                <input class="form-control" id="joinCode" maxlength="12" placeholder="Invite code" aria-label="League invite code" />
                <input class="form-control" id="joinTeamName" maxlength="40" placeholder="Team name" aria-label="Fantasy team name" />
                <button class="secondary-btn" id="joinCloudLeagueBtn" disabled>Join League</button>
              </div>
            </div>
          </div>
        </details>
      </section>

      <section class="card league-format-card">
        <div class="section-head">
          <div><div class="eyebrow">LEAGUE FORMAT</div><h3>Rules & setup</h3></div>
          <button class="text-btn" id="rulesBtn">View Scoring</button>
        </div>
        <div class="settings-list" id="leagueSettingsSummary">
          <div><span>Teams</span><strong>8</strong></div>
          <div><span>Draft</span><strong>Snake</strong></div>
          <div><span>Scoring</span><strong>Head-to-head</strong></div>
          <div><span>Roster</span><strong>TOP · JNG · MID · ADC · SUP · FLEX</strong></div>
        </div>
      </section>
    </section>
  </template>

  <template id="transactions-template">
    <section class="stack">
      <div class="section-title"><div><div class="eyebrow">ROSTER MOVES</div><h2>Waivers & Transactions</h2></div><button class="secondary-btn" data-jump="team">My Team</button></div>
      <div class="transaction-summary">
        <div class="card mini-summary"><small>League</small><strong id="transactionLeagueName">—</strong></div>
        <div class="card mini-summary"><small>Pending claims</small><strong id="pendingClaimCount">0</strong></div>
        <div class="card mini-summary"><small>Roster moves</small><strong id="transactionMoveCount">0</strong></div>
      </div>
      <div class="filter-row transaction-tabs">
        <button class="chip active" data-transaction-tab="pending">Pending</button>
        <button class="chip" data-transaction-tab="history">My History</button>
        <button class="chip" data-transaction-tab="activity">League Activity</button>
      </div>
      <section class="card waiver-info"><div class="section-head"><div><div class="eyebrow">WAIVERS</div><h3>League claims</h3></div></div><p>Claims are shared with your league. Automatic scheduled waiver processing is not enabled yet.</p></section>
      <div id="transactionContent" class="stack tight"></div>
      <div class="grid-two">
        <button class="wide-link-btn" data-jump="players">Browse players →</button>
        <button class="wide-link-btn" data-jump="trade">Trade Center →</button>
      </div>
    </section>
  </template>

  <template id="trade-template">
    <section class="stack">
      <div class="section-title">
        <div><div class="eyebrow">TRADE CENTER</div><h2>Trades</h2></div>
        <button class="secondary-btn" data-jump="transactions">Transactions</button>
      </div>

      <section class="card trade-builder">
        <div class="section-head"><div><div class="eyebrow">TRADE CENTER</div><h3>Build a trade offer</h3></div></div>
        <p class="prototype-note">Offers use the actual rosters in your active league.</p>
        <div class="form-group">
          <label for="tradePartner">Trade with</label>
          <select id="tradePartner" class="form-control"></select>
        </div>
        <div class="trade-columns">
          <div>
            <div class="trade-label">YOU SEND</div>
            <div id="tradeMyPlayers" class="trade-player-list"></div>
          </div>
          <div>
            <div class="trade-label">YOU RECEIVE</div>
            <div id="tradeTheirPlayers" class="trade-player-list"></div>
          </div>
        </div>
        <div class="trade-summary-box" id="tradeSummaryBox">
          Select one player from each side to build an offer.
        </div>
        <button class="primary-btn" id="submitTradeBtn" disabled>Send Trade Offer</button>
      </section>

      <div class="filter-row">
        <button class="chip active" data-trade-tab="offers">My Offers</button>
        <button class="chip" data-trade-tab="incoming">Incoming</button>
        <button class="chip" data-trade-tab="history">History</button>
      </div>
      <div id="tradeContent" class="stack tight"></div>
    </section>
  </template>

  <template id="draft-template">
    <section class="stack draft-screen">
      <div class="section-title">
        <div><div class="eyebrow">LIVE LEAGUE DRAFT</div><h2>Draft Room</h2></div>
        <button class="secondary-btn" data-jump="league">Exit</button>
      </div>

      <div class="card draft-status">
        <div>
          <div class="eyebrow" id="draftRoundLabel">ROUND 1 · PICK 1</div>
          <h3 id="draftTurnLabel">Draft ready</h3>
          <small id="draftHint">Start the draft to begin.</small>
        </div>
        <div class="draft-clock" id="draftClock">0:30</div>
      </div>

      <div class="draft-actions">
        <button class="primary-btn" id="startDraftBtn" hidden>Start Draft</button>
        <button class="secondary-btn" id="refreshDraftBtn">Refresh Draft</button>
      </div>

      <section class="roster-status-banner" id="draftRosterStatus" aria-live="polite">
        <strong id="draftRosterStatusTitle">⚠ Roster Incomplete</strong>
        <small id="draftRosterStatusCopy">Roster needs will appear as you draft.</small>
      </section>

      <div class="card draft-board-card">
        <div class="section-head">
          <div><div class="eyebrow">DRAFT BOARD</div><h3>Recent picks</h3></div>
          <span class="draft-progress" id="draftProgress">0 picks</span>
        </div>
        <div id="draftBoard" class="draft-board"></div>
      </div>

      <div class="card full-board-card">
        <div class="section-head">
          <div><div class="eyebrow">FULL BOARD</div><h3>Round by round</h3></div>
        </div>
        <div id="fullDraftBoard" class="full-draft-board"></div>
      </div>

      <label class="search"><span>⌕</span><input id="draftSearch" aria-label="Search draft pool" placeholder="Search draft pool" /></label>
      <div class="filter-row" id="draftFilters">
        <button class="chip active" data-draft-role="ALL">All</button>
        <button class="chip" data-draft-role="TOP">Top</button>
        <button class="chip" data-draft-role="JNG">Jungle</button>
        <button class="chip" data-draft-role="MID">Mid</button>
        <button class="chip" data-draft-role="ADC">ADC</button>
        <button class="chip" data-draft-role="SUP">Support</button>
      </div>
      <div id="draftPlayerList" class="player-list"></div>

      <div class="card">
        <div class="section-head"><div><div class="eyebrow">MY PICKS</div><h3 id="draftMyTeamName">My Team</h3></div></div>
        <div id="myDraftRoster" class="draft-roster"></div>
      </div>
    </section>
  </template>

  <template id="setup-template">
    <section class="stack" id="setupScreen">
      <div class="section-title">
        <div><div class="eyebrow">COMMISSIONER TOOLS</div><h2>League Setup</h2></div>
        <button class="secondary-btn" data-jump="league">Back</button>
      </div>

      <div class="card setup-card">
        <div class="form-group">
          <label for="leagueName">League name</label>
          <input id="leagueName" class="form-control" value="Summoner's Cup" maxlength="40" />
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="managerCount">Managers</label>
            <select id="managerCount" class="form-control">
              <option>2</option><option selected>4</option><option>6</option><option>8</option><option>10</option><option>12</option>
            </select>
          </div>
          <div class="form-group">
            <label for="benchCount">Bench spots</label>
            <select id="benchCount" class="form-control">
              <option selected>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Draft type</label>
          <div class="option-grid" data-choice-group="draftType">
            <button class="choice active" data-value="Snake"><strong>Snake Draft</strong><small>Managers take turns drafting players.</small></button>
            <button class="choice disabled-choice" data-value="Salary Cap" disabled aria-disabled="true"><strong>Salary Cap</strong><small>Coming soon. Snake draft is currently supported.</small></button>
          </div>
        </div>

        <div class="form-group">
          <label>Scoring format</label>
          <div class="option-grid" data-choice-group="scoringFormat">
            <button class="choice active" data-value="Head-to-head"><strong>Head-to-Head</strong><small>Face one manager each fantasy round.</small></button>
            <button class="choice disabled-choice" data-value="Total Points" disabled aria-disabled="true"><strong>Total Points</strong><small>Coming soon. Head-to-head is currently supported.</small></button>
          </div>
        </div>

        <div class="form-group">
          <label for="competition">Competition focus</label>
          <select id="competition" class="form-control">
            <option selected>Worlds</option>
            <option>MSI</option>
            <option>LCK</option>
            <option>LPL</option>
            <option>LEC</option>
            <option>LTA</option>
          </select>
          <small class="field-help">Saved as a league preference. Competition-specific player filtering is not active yet.</small>
        </div>

        <div class="form-group">
          <label>Starting roster</label>
          <div class="position-grid">
            <span>TOP</span><span>JNG</span><span>MID</span><span>ADC</span><span>SUP</span><span>FLEX</span>
          </div>
          <label class="toggle-row">
            <span><strong>Team slot</strong><small>Coming soon. Team-objective scoring is not active yet.</small></span>
            <input id="teamSlot" type="checkbox" disabled aria-disabled="true" />
          </label>
        </div>
      </div>

      <div class="card setup-card">
        <div class="section-head"><div><div class="eyebrow">PLAYER SCORING</div><h3>Default points</h3></div></div>
        <div class="scoring-grid">
          <label>Kills <input class="score-input" id="scoreKills" type="number" step="0.5" value="3"></label>
          <label>Deaths <input class="score-input" id="scoreDeaths" type="number" step="0.5" value="-1"></label>
          <label>Assists <input class="score-input" id="scoreAssists" type="number" step="0.5" value="2"></label>
          <label>CS <input class="score-input" id="scoreCs" type="number" step="0.01" value="0.02"></label>
          <label>Win <input class="score-input" id="scoreWin" type="number" step="0.5" value="5"></label>
          <label>First Blood <input class="score-input" id="scoreFb" type="number" step="0.5" value="2"></label>
        </div>
        <small class="field-help">These scoring rules are shared with every manager in this league. Live game-stat scoring will use them once the scoring feed is connected.</small>
      </div>

      <div class="card setup-card">
        <div class="section-head"><div><div class="eyebrow">LEAGUE MEMBERS</div><h3>Manager controls</h3></div></div>
        <div id="commissionerMemberList" class="stack tight">
          <div class="empty-state"><strong>Loading managers…</strong><small>Commissioner controls are available before the draft begins.</small></div>
        </div>
      </div>

      <div class="card setup-card league-management-card" id="leagueManagementCard">
        <div class="section-head"><div><div class="eyebrow">LEAGUE MANAGEMENT</div><h3>League lifecycle</h3></div><span class="status-pill" id="managementStatusPill">ACTIVE</span></div>
        <p class="profile-copy" id="managementStatusCopy">End league activity without deleting league history.</p>
        <div class="league-management-actions">
          <button class="danger-btn" id="disbandLeagueBtn" type="button">Disband League</button>
          <button class="secondary-btn" id="reactivateLeagueBtn" type="button" hidden>Reactivate League</button>
          <button class="secondary-btn" id="renewLeagueBtn" type="button" hidden>Renew League for Next Season</button>
        </div>
        <small class="field-help">Disbanding makes the league read-only. Rosters, draft results, transactions, scores, and league history are preserved.</small>
      </div>

      <button class="primary-btn" id="saveLeagueBtn">Save League Settings</button>
      <p class="setup-footnote">Commissioner changes are shared with every manager. Settings lock when the league draft begins.</p>
    </section>
  </template>

  <div class="transaction-modal" id="transactionModal" hidden>
    <div class="transaction-backdrop" data-close-transaction></div>
    <section class="transaction-sheet" role="dialog" aria-modal="true" aria-labelledby="transactionTitle">
      <div class="section-head">
        <div><div class="eyebrow">ROSTER FULL</div><h3 id="transactionTitle">Choose a player to drop</h3></div>
        <button class="icon-btn small-icon" data-close-transaction aria-label="Close">×</button>
      </div>
      <p class="transaction-copy" id="transactionCopy"></p>
      <div id="transactionDropList" class="stack tight"></div>
      <button class="secondary-btn transaction-cancel" data-close-transaction>Cancel</button>
    </section>
  </div>

  <div class="transaction-modal" id="lineupSwapModal" hidden>
    <div class="transaction-backdrop" data-close-lineup-swap></div>
    <section class="transaction-sheet" role="dialog" aria-modal="true" aria-labelledby="lineupSwapTitle">
      <div class="section-head">
        <div><div class="eyebrow">LINEUP FULL</div><h3 id="lineupSwapTitle">Who would you like to replace?</h3></div>
        <button class="icon-btn small-icon" data-close-lineup-swap aria-label="Close">×</button>
      </div>
      <p class="transaction-copy" id="lineupSwapCopy">Your starting lineup is full. Choose an eligible player to swap.</p>
      <div id="lineupSwapList" class="stack tight"></div>
      <button class="secondary-btn transaction-cancel" data-close-lineup-swap>Cancel</button>
    </section>
  </div>

  <div class="notification-panel" id="notificationPanel" hidden>
    <div class="notification-backdrop" data-close-notifications></div>
    <section class="notification-sheet" role="dialog" aria-modal="true" aria-labelledby="notificationTitle">
      <div class="section-head">
        <div><div class="eyebrow">LEAGUE ACTIVITY</div><h3 id="notificationTitle">Notifications</h3></div>
        <button class="icon-btn small-icon" data-close-notifications aria-label="Close notifications">×</button>
      </div>
      <div class="notification-toolbar">
        <small id="notificationSummary">League updates appear here.</small>
        <button class="text-btn" id="markNotificationsRead">Mark all read</button>
      </div>
      <div id="notificationList" class="notification-list"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="esports-data.js?v=20261005-4"></script>
  <script src="backend-config.js?v=20261005-4"></script>
  <script src="backend.js?v=20261005-4"></script>
  <script src="player-stats.js?v=20261005-4"></script>
  <script src="app.js?v=20261005-4"></script>
</body>
</html>
