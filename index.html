<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1220" />
  <title>Rift Fantasy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">FANTASY LEAGUE OF LEGENDS</div>
        <h1>Rift Fantasy</h1>
      </div>
      <button class="icon-btn" id="notificationBtn" aria-label="Notifications">🔔</button>
    </header>

    <main id="app"></main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button class="nav-item active" data-view="home"><span>⌂</span><small>Home</small></button>
      <button class="nav-item" data-view="team"><span>♟</span><small>My Team</small></button>
      <button class="nav-item" data-view="matchup"><span>⚔</span><small>Matchup</small></button>
      <button class="nav-item" data-view="schedule"><span>▣</span><small>Schedule</small></button>
      <button class="nav-item" data-view="players"><span>⌕</span><small>Players</small></button>
      <button class="nav-item" data-view="league"><span>🏆</span><small>League</small></button>
    </nav>
  </div>

  <template id="home-template">
    <section class="stack">
      <div class="hero card">
        <div>
          <div class="eyebrow accent">WEEK 3</div>
          <h2>You're projected to win</h2>
          <p class="muted">Live scoring updates during pro matches.</p>
        </div>
        <div class="projection">61%</div>
      </div>

      <section class="card">
        <div class="section-head">
          <div><div class="eyebrow">YOUR MATCHUP</div><h3>Summoner's Cup</h3></div>
          <button class="text-btn" data-jump="matchup">View matchup</button>
        </div>
        <div class="scoreboard">
          <div class="manager">
            <div class="avatar">Z</div>
            <strong>Zeuxidamus</strong>
            <span class="big-score">87.4</span>
            <small>Proj. 128.6</small>
          </div>
          <div class="versus">VS</div>
          <div class="manager">
            <div class="avatar rival">R</div>
            <strong>Rift Raiders</strong>
            <span class="big-score">72.1</span>
            <small>Proj. 119.2</small>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="section-head"><div><div class="eyebrow">UP NEXT</div><h3>Your starters</h3></div><button class="text-btn" data-jump="team">Manage</button></div>
        <div id="starterPreview" class="player-list"></div>
      </section>

      <section class="grid-two">
        <button class="action-card" data-jump="players"><span class="action-icon">＋</span><strong>Add Players</strong><small>Browse free agents</small></button>
        <button class="action-card" id="draftBtn"><span class="action-icon">◎</span><strong>Mock Draft</strong><small>Practice a draft</small></button>
      </section>
    </section>
  </template>

  <template id="team-template">
    <section class="stack">
      <div class="section-title">
        <div><div class="eyebrow">WEEK 3 LINEUP</div><h2>My Team</h2></div>
        <div class="record">2-0</div>
      </div>
      <div class="card compact"><div class="stat-row"><span>Projected</span><strong>128.6</strong></div><div class="stat-row"><span>League rank</span><strong>#2</strong></div></div>
      <div id="rosterList" class="roster"></div>
    </section>
  </template>

  <template id="matchup-template">
    <section class="stack">
      <div class="section-title"><div><div class="eyebrow">HEAD TO HEAD</div><h2>Week 3 Matchup</h2></div><span class="live-pill">LIVE</span></div>
      <div class="card matchup-card">
        <div class="match-score"><div><span class="avatar">Z</span><strong>Zeuxidamus</strong><b>87.4</b></div><span>VS</span><div><span class="avatar rival">R</span><strong>Rift Raiders</strong><b>72.1</b></div></div>
        <div class="progress"><span style="width:55%"></span></div>
        <div class="projection-row"><span>128.6 projected</span><span>119.2 projected</span></div>
      </div>
      <h3>Position battles</h3>
      <div id="battleList" class="stack tight"></div>
    </section>
  </template>

  <template id="schedule-template">
    <section class="stack">
      <div class="section-title">
        <div><div class="eyebrow">PRO MATCHES</div><h2>Schedule</h2></div>
        <span class="schedule-zone">LOCAL TIME</span>
      </div>
      <div class="filter-row schedule-filters">
        <button class="chip active" data-day="all">All</button>
        <button class="chip" data-day="today">Today</button>
        <button class="chip" data-day="tomorrow">Tomorrow</button>
        <button class="chip" data-day="upcoming">Upcoming</button>
      </div>
      <div class="card schedule-note">
        <strong>Prototype schedule</strong>
        <small>Match data is sample data for now. We can connect this to live esports schedules next.</small>
      </div>
      <div id="scheduleList" class="stack tight"></div>
    </section>
  </template>

  <template id="players-template">
    <section class="stack">
      <div class="section-title"><div><div class="eyebrow">FREE AGENTS</div><h2>Players</h2></div></div>
      <label class="search"><span>⌕</span><input id="playerSearch" placeholder="Search players, teams or roles" /></label>
      <div class="filter-row">
        <button class="chip active" data-role="ALL">All</button>
        <button class="chip" data-role="TOP">Top</button>
        <button class="chip" data-role="JNG">Jungle</button>
        <button class="chip" data-role="MID">Mid</button>
        <button class="chip" data-role="ADC">ADC</button>
        <button class="chip" data-role="SUP">Support</button>
      </div>
      <div id="freeAgentList" class="player-list"></div>
    </section>
  </template>

  <template id="league-template">
    <section class="stack">
      <div class="section-title"><div><div class="eyebrow">SUMMONER'S CUP</div><h2>League</h2></div><button class="secondary-btn" data-jump="setup">League Setup</button></div>
      <div class="card">
        <div class="section-head"><div><div class="eyebrow">STANDINGS</div><h3>Regular Season</h3></div></div>
        <div id="standings"></div>
      </div>
      <div class="grid-two">
        <button class="action-card" data-jump="draft"><span class="action-icon">◎</span><strong>Draft Room</strong><small>Run a mock snake draft</small></button>
        <button class="action-card" data-jump="setup"><span class="action-icon">⚙</span><strong>League Setup</strong><small>Edit format & scoring</small></button>
      </div>
      <div class="card">
        <div class="section-head"><div><div class="eyebrow">LEAGUE SETTINGS</div><h3>Current format</h3></div><button class="text-btn" id="rulesBtn">Scoring</button></div>
        <div class="settings-list" id="leagueSettingsSummary">
          <div><span>Teams</span><strong>8</strong></div>
          <div><span>Draft</span><strong>Snake</strong></div>
          <div><span>Scoring</span><strong>Head-to-head</strong></div>
          <div><span>Roster</span><strong>TOP · JNG · MID · ADC · SUP</strong></div>
        </div>
      </div>
    </section>
  </template>

  <template id="draft-template">
    <section class="stack draft-screen">
      <div class="section-title">
        <div><div class="eyebrow">MOCK DRAFT</div><h2>Draft Room</h2></div>
        <button class="secondary-btn" data-jump="league">Exit</button>
      </div>

      <div class="card draft-status">
        <div>
          <div class="eyebrow" id="draftRoundLabel">ROUND 1 · PICK 1</div>
          <h3 id="draftTurnLabel">Draft ready</h3>
          <small id="draftHint">Start the draft to begin.</small>
        </div>
        <div class="draft-clock" id="draftClock">0:30</div>
      </div>

      <div class="draft-actions">
        <button class="primary-btn" id="startDraftBtn">Start / Reset Draft</button>
        <button class="secondary-btn" id="autoPickBtn">Auto Pick My Turn</button>
      </div>

      <div class="card draft-board-card">
        <div class="section-head">
          <div><div class="eyebrow">DRAFT BOARD</div><h3>Recent picks</h3></div>
          <span class="draft-progress" id="draftProgress">0 picks</span>
        </div>
        <div id="draftBoard" class="draft-board"></div>
      </div>

      <div class="card full-board-card">
        <div class="section-head">
          <div><div class="eyebrow">FULL BOARD</div><h3>Round by round</h3></div>
        </div>
        <div id="fullDraftBoard" class="full-draft-board"></div>
      </div>

      <label class="search"><span>⌕</span><input id="draftSearch" placeholder="Search draft pool" /></label>
      <div class="filter-row" id="draftFilters">
        <button class="chip active" data-draft-role="ALL">All</button>
        <button class="chip" data-draft-role="TOP">Top</button>
        <button class="chip" data-draft-role="JNG">Jungle</button>
        <button class="chip" data-draft-role="MID">Mid</button>
        <button class="chip" data-draft-role="ADC">ADC</button>
        <button class="chip" data-draft-role="SUP">Support</button>
      </div>
      <div id="draftPlayerList" class="player-list"></div>

      <div class="card">
        <div class="section-head"><div><div class="eyebrow">MY PICKS</div><h3>Zeuxidamus</h3></div></div>
        <div id="myDraftRoster" class="draft-roster"></div>
      </div>
    </section>
  </template>

  <template id="setup-template">
    <section class="stack">
      <div class="section-title">
        <div><div class="eyebrow">COMMISSIONER TOOLS</div><h2>League Setup</h2></div>
        <button class="secondary-btn" data-jump="league">Back</button>
      </div>

      <div class="card setup-card">
        <div class="form-group">
          <label for="leagueName">League name</label>
          <input id="leagueName" class="form-control" value="Summoner's Cup" maxlength="40" />
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="managerCount">Managers</label>
            <select id="managerCount" class="form-control">
              <option>4</option><option>6</option><option selected>8</option><option>10</option><option>12</option>
            </select>
          </div>
          <div class="form-group">
            <label for="benchCount">Bench spots</label>
            <select id="benchCount" class="form-control">
              <option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Draft type</label>
          <div class="option-grid" data-choice-group="draftType">
            <button class="choice active" data-value="Snake"><strong>Snake Draft</strong><small>Managers take turns drafting players.</small></button>
            <button class="choice" data-value="Salary Cap"><strong>Salary Cap</strong><small>Build a roster within a budget.</small></button>
          </div>
        </div>

        <div class="form-group">
          <label>Scoring format</label>
          <div class="option-grid" data-choice-group="scoringFormat">
            <button class="choice active" data-value="Head-to-head"><strong>Head-to-Head</strong><small>Face one manager each fantasy round.</small></button>
            <button class="choice" data-value="Total Points"><strong>Total Points</strong><small>Highest season or tournament total wins.</small></button>
          </div>
        </div>

        <div class="form-group">
          <label for="competition">Competition</label>
          <select id="competition" class="form-control">
            <option selected>Worlds</option>
            <option>MSI</option>
            <option>LCK</option>
            <option>LPL</option>
            <option>LEC</option>
            <option>LTA</option>
          </select>
        </div>

        <div class="form-group">
          <label>Starting roster</label>
          <div class="position-grid">
            <span>TOP</span><span>JNG</span><span>MID</span><span>ADC</span><span>SUP</span><span class="optional">TEAM</span>
          </div>
          <label class="toggle-row">
            <span><strong>Team slot</strong><small>Draft one pro team for objective-based scoring.</small></span>
            <input id="teamSlot" type="checkbox" />
          </label>
        </div>
      </div>

      <div class="card setup-card">
        <div class="section-head"><div><div class="eyebrow">PLAYER SCORING</div><h3>Default points</h3></div></div>
        <div class="scoring-grid">
          <label>Kills <input class="score-input" id="scoreKills" type="number" step="0.5" value="3"></label>
          <label>Deaths <input class="score-input" id="scoreDeaths" type="number" step="0.5" value="-1"></label>
          <label>Assists <input class="score-input" id="scoreAssists" type="number" step="0.5" value="2"></label>
          <label>CS <input class="score-input" id="scoreCs" type="number" step="0.01" value="0.02"></label>
          <label>Win <input class="score-input" id="scoreWin" type="number" step="0.5" value="5"></label>
          <label>First Blood <input class="score-input" id="scoreFb" type="number" step="0.5" value="2"></label>
        </div>
      </div>

      <button class="primary-btn" id="saveLeagueBtn">Save League Settings</button>
      <p class="setup-footnote">Prototype only: these settings are stored on this device for now.</p>
    </section>
  </template>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
